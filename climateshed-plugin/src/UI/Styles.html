<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    color: #333;
    margin: 0;
    padding: 12px;
  }

  h3 {
    font-size: 14px;
    margin: 0 0 12px 0;
    color: #1a73e8;
  }

  .section {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-weight: bold;
    margin-bottom: 4px;
    font-size: 12px;
    color: #555;
  }

  .optional {
    font-weight: normal;
    color: #888;
  }

  .field-hint {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
  }

  .claim-display {
    background: #f1f3f4;
    border-left: 3px solid #1a73e8;
    padding: 8px 10px;
    margin-bottom: 16px;
    font-style: italic;
    font-size: 12px;
    word-wrap: break-word;
    max-height: 80px;
    overflow-y: auto;
  }

  select, textarea, input[type="text"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    font-size: 13px;
    box-sizing: border-box;
  }

  select:focus, textarea:focus, input[type="text"]:focus {
    outline: none;
    border-color: #1a73e8;
  }

  textarea {
    resize: vertical;
    min-height: 50px;
  }

  .radio-group {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }

  .radio-group label {
    font-weight: normal;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }

  .btn {
    flex: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }

  .btn-small {
    width: 100%;
    padding: 6px;
    font-size: 12px;
  }

  .btn-primary {
    background: #1a73e8;
    color: white;
  }

  .btn-primary:hover {
    background: #1557b0;
  }

  .btn-secondary {
    background: #f1f3f4;
    color: #333;
  }

  .btn-secondary:hover {
    background: #dadce0;
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .link-btn {
    background: none;
    border: none;
    padding: 0;
    color: #1a73e8;
    font-size: 11px;
    cursor: pointer;
  }

  .link-btn:hover {
    text-decoration: underline;
  }

  /* Structured sources */
  .source-card {
    border: 1px solid #dadce0;
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 8px;
  }

  .source-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .source-card-number {
    font-size: 11px;
    font-weight: bold;
    color: #555;
  }

  .source-field {
    margin-bottom: 6px;
  }

  .source-field label {
    font-weight: normal;
    font-size: 11px;
    color: #666;
    margin-bottom: 2px;
  }

  .source-row {
    display: flex;
    gap: 6px;
  }

  .source-field-half {
    flex: 1;
    min-width: 0;
  }

  .error {
    color: #d93025;
    font-size: 12px;
    margin-top: 4px;
    display: none;
  }

  .error.visible {
    display: block;
  }

  .field-error select,
  .field-error textarea,
  .field-error input {
    border-color: #d93025;
  }

  .status-msg {
    text-align: center;
    padding: 8px;
    font-size: 12px;
    margin-top: 8px;
    border-radius: 4px;
    display: none;
  }

  .status-msg.success {
    display: block;
    background: #e6f4ea;
    color: #137333;
  }

  .status-msg.error {
    display: block;
    background: #fce8e6;
    color: #d93025;
  }

  .confidence-hint {
    display: none;
    font-size: 11px;
    color: #e37400;
    background: #fef7e0;
    border-radius: 4px;
    padding: 6px 8px;
    margin-top: 6px;
    line-height: 1.4;
  }

  .loading {
    text-align: center;
    padding: 16px;
    color: #888;
    font-size: 12px;
  }

  .loading::after {
    content: '';
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #dadce0;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* Evidence from Climateshed */
  .evidence-panel {
    border: 1px solid #d2e3fc;
    background: #f8fbff;
    border-radius: 4px;
    padding: 8px;
  }

  .evidence-body p {
    margin: 0 0 8px 0;
    font-size: 12px;
    line-height: 1.4;
  }

  .evidence-body input[type="text"] {
    margin-bottom: 6px;
  }

  .evidence-muted {
    color: #555;
  }

  .evidence-small {
    font-size: 11px !important;
    color: #777;
  }

  .evidence-warning {
    color: #b06000;
  }

  .evidence-error {
    color: #d93025;
    margin-top: 4px !important;
  }

  .evidence-error:empty {
    display: none;
  }

  .evidence-loading::after {
    content: '';
    display: inline-block;
    width: 10px;
    height: 10px;
    border: 2px solid #dadce0;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 6px;
    vertical-align: middle;
  }

  .evidence-body textarea {
    margin-bottom: 6px;
    font-size: 12px;
  }

  .evidence-query {
    background: white;
    border: 1px dashed #c6dafc;
    border-radius: 4px;
    padding: 6px 8px;
    margin-bottom: 8px;
  }

  .evidence-query-label {
    font-size: 11px;
    color: #666;
  }

  .evidence-query-text {
    font-size: 12px;
    color: #333;
    font-style: italic;
    margin: 2px 0 4px;
    word-wrap: break-word;
  }

  .evidence-result {
    background: white;
    border: 1px solid #dadce0;
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 8px;
  }

  .evidence-result-title {
    font-weight: bold;
    font-size: 12px;
    color: #333;
    word-wrap: break-word;
  }

  .evidence-query-place {
    font-size: 11px;
    color: #555;
    margin-bottom: 4px;
  }

  .evidence-place {
    display: inline-block;
    font-size: 10px;
    border-radius: 8px;
    padding: 1px 6px;
    margin-bottom: 6px;
  }

  .evidence-place-same {
    background: #e6f4ea;
    color: #137333;
  }

  .evidence-place-related {
    background: #e8f0fe;
    color: #1967d2;
  }

  .evidence-place-other {
    background: #fef7e0;
    color: #b06000;
  }

  .evidence-result-meta {
    font-size: 11px;
    color: #666;
    margin: 2px 0 6px;
  }

  .evidence-passage {
    font-size: 12px;
    color: #444;
    line-height: 1.4;
    margin-bottom: 6px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .evidence-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .evidence-actions a {
    font-size: 11px;
    color: #1a73e8;
  }

  .evidence-add-btn {
    flex: none;
    margin-left: auto;
    padding: 4px 10px;
    font-size: 11px;
  }

  .evidence-footer {
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #666;
    margin-top: 6px;
  }

  /* Climate projections card */
  .evidence-data {
    border-left: 3px solid #1a73e8;
  }

  .evidence-data-decade {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #555;
    margin-bottom: 6px;
  }

  .evidence-data-decade select {
    width: auto;
    padding: 2px 4px;
    font-size: 12px;
  }

  .evidence-data-measure {
    margin-bottom: 8px;
  }

  .evidence-data-label {
    font-size: 12px;
    font-weight: bold;
    color: #333;
    margin-bottom: 2px;
  }

  .evidence-data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }

  .evidence-data-table th,
  .evidence-data-table td {
    padding: 2px 3px;
    border-bottom: 1px solid #f1f3f4;
    white-space: nowrap;
  }

  .evidence-data-table th {
    text-align: left;
    font-weight: normal;
    color: #555;
  }

  .evidence-data-table tr:first-child th {
    font-size: 10px;
    color: #888;
  }

  .evidence-data-table tr:first-child th + th,
  .evidence-data-table td {
    text-align: right;
  }

  .evidence-data-range {
    color: #666;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
