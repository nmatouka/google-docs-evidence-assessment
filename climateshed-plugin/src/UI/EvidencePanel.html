<!--
  Evidence from Climateshed. Included into Sidebar.html.
  Suggestions only: nothing reaches the assessment unless the author clicks
  "Add as source". All text from the server is inserted with textContent.
-->
<div class="section evidence-panel" id="evidencePanel">
  <label>Evidence from Climateshed</label>
  <div id="evidenceBody" class="evidence-body"></div>
  <div id="evidenceFooter" class="evidence-footer" style="display:none;">
    <span id="evidenceSignedInAs"></span>
    <button type="button" class="link-btn" id="evidenceSignOutBtn">Sign out</button>
  </div>
</div>

<script>
  var evidenceState = {
    claim: null,          // { text, pendingRangeName?, assessmentId? } for the claim in the sidebar
    account: null,        // last successful result of getClimateshedAccount()
    pendingEmail: '',     // email a sign-in code was sent to
    searchedClaim: null,  // text of the claim whose results are displayed
    lastResult: null      // last successful search result (with .relations once labeled), to return to after editing the search
  };

  var EVIDENCE_DOC_TYPE_LABELS = {
    scientific: 'Scientific',
    report: 'Report',
    assessment: 'Assessment',
    regulation: 'Regulation',
    plan: 'Plan',
    strategy: 'Strategy',
    guidance: 'Guidance',
    data: 'Data'
  };

  var EVIDENCE_QUERY_LABELS = {
    rewritten: 'Searched for (reworded using the heading and nearby text):',
    author: 'Searched for (your edited search):',
    claim: 'Searched for your claim as written:'
  };

  var EVIDENCE_SCENARIO_LABELS = {
    ssp245: 'SSP2-4.5',
    ssp370: 'SSP3-7.0',
    ssp585: 'SSP5-8.5'
  };

  // Passages labeled does_not_address are hidden, so they have no badge.
  var EVIDENCE_RELATION_LABELS = {
    supports: 'Supports the claim',
    qualifies: 'Qualifies the claim',
    contradicts: 'Contradicts the claim'
  };

  var EVIDENCE_EXCERPT_CHARS = 280;

  /**
   * Starts or refreshes the panel for a claim. The sidebar calls this when a
   * claim is shown: on open, after Capture Selection, and in edit mode.
   * @param {Object|null} claim - { text, pendingRangeName?, assessmentId? }
   */
  function startEvidencePanel(claim) {
    evidenceState.claim = claim && claim.text ? claim : null;
    document.getElementById('evidenceSignOutBtn').onclick = signOutOfEvidence;

    if (evidenceState.account) {
      onEvidenceAccount(evidenceState.account);
      return;
    }

    renderEvidenceMessage('Checking your Climateshed account...', true);
    google.script.run
      .withSuccessHandler(onEvidenceAccount)
      .withFailureHandler(function(err) {
        renderEvidenceError(err.message, function() { startEvidencePanel(evidenceState.claim); });
      })
      .getClimateshedAccount();
  }

  /**
   * Shows the right panel state for the account, and searches when allowed.
   * @param {Object} result - From getClimateshedAccount() or verifyClimateshedCode().
   */
  function onEvidenceAccount(result) {
    if (result && result.permissionRequired) {
      renderEvidencePermission(result);
      return;
    }
    if (!result || !result.success) {
      renderEvidenceError(result && result.error, function() { startEvidencePanel(evidenceState.claim); });
      return;
    }

    evidenceState.account = result;
    updateEvidenceFooter();

    if (!result.signedIn) {
      renderEvidenceSignIn(result.expired ? 'Your Climateshed session expired. Sign in again to search.' : '');
    } else if (!result.access.allowed) {
      renderEvidenceNoAccess(result.access);
    } else if (!evidenceState.claim) {
      renderEvidenceMessage('Select a claim to search Climateshed for sources.');
    } else if (evidenceState.searchedClaim !== evidenceState.claim.text) {
      runEvidenceSearch(null);
    }
  }

  /**
   * Searches for the current claim. Climateshed rewords the claim using its
   * heading and nearby text, unless the author edited the search text.
   * @param {string|null} query - Search text the author edited, searched as written.
   */
  function runEvidenceSearch(query) {
    var claim = evidenceState.claim;
    if (!claim) {
      return;
    }
    var retry = function() { runEvidenceSearch(query); };
    renderEvidenceMessage(query
      ? 'Searching Climateshed for your edited search...'
      : 'Searching Climateshed... The first search after a quiet period can take up to 30 seconds.', true);

    google.script.run
      .withSuccessHandler(function(result) {
        if (claim !== evidenceState.claim) {
          return; // A different claim was captured while this search ran.
        }
        if (result && result.success) {
          if (query && !result.data && evidenceState.lastResult) {
            // Climate data comes from reading the claim, which an edited search skips.
            result.data = evidenceState.lastResult.data || null;
          }
          evidenceState.searchedClaim = claim.text;
          evidenceState.lastResult = result;
          renderEvidenceResults(result);
        } else {
          renderEvidenceFailure(result, retry);
        }
      })
      .withFailureHandler(function(err) {
        if (claim === evidenceState.claim) {
          renderEvidenceError(err.message, retry);
        }
      })
      .searchClimateshedEvidence({
        claimText: claim.text,
        pendingRangeName: claim.pendingRangeName || null,
        assessmentId: claim.assessmentId || null,
        query: query || null,
        // An edited search keeps the place found for the claim, for result ordering.
        place: query && evidenceState.lastResult ? evidenceState.lastResult.claimPlace || null : null
      });
  }

  /**
   * Shows the panel state for a failed Climateshed call: the permission
   * prompt, sign-in, no access, or an error with an optional retry.
   * @param {Object|null} result - { success: false, ... } from a Climateshed.gs function.
   * @param {Function|null} retry
   */
  function renderEvidenceFailure(result, retry) {
    if (result && result.permissionRequired) {
      renderEvidencePermission(result);
    } else if (result && result.signedOut) {
      onEvidenceAccount({ success: true, signedIn: false, expired: true });
    } else if (result && result.accessDenied) {
      var access = { allowed: false, message: result.error, accountUrl: result.accountUrl };
      if (evidenceState.account) {
        evidenceState.account.access = access;
      }
      renderEvidenceNoAccess(access);
    } else {
      renderEvidenceError(result && result.error, retry);
    }
  }

  /**
   * Runs a Climateshed.gs function from a button, with a busy label and inline errors.
   * @param {HTMLButtonElement} button
   * @param {string} busyLabel
   * @param {HTMLElement} errorEl
   * @param {string} functionName - Server function in Climateshed.gs.
   * @param {Array} args
   * @param {Function} onSuccess - Receives the { success: true, ... } result.
   */
  function runEvidenceAction(button, busyLabel, errorEl, functionName, args, onSuccess) {
    var idleLabel = button.textContent;
    var fail = function(message) {
      errorEl.textContent = message || 'Something went wrong reaching Climateshed.';
      button.disabled = false;
      button.textContent = idleLabel;
    };

    errorEl.textContent = '';
    button.disabled = true;
    button.textContent = busyLabel;

    var runner = google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          onSuccess(result);
        } else if (result && result.permissionRequired) {
          renderEvidencePermission(result);
        } else {
          fail(result && result.error);
        }
      })
      .withFailureHandler(function(err) { fail(err.message); });
    runner[functionName].apply(runner, args);
  }

  function evidenceEl(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function evidenceButton(className, label, onClick) {
    var button = evidenceEl('button', className, label);
    button.type = 'button';
    button.addEventListener('click', function() { onClick(); });
    return button;
  }

  function evidenceLink(label, url) {
    var link = evidenceEl('a', '', label);
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    return link;
  }

  function resetEvidenceBody() {
    var body = document.getElementById('evidenceBody');
    while (body.firstChild) {
      body.removeChild(body.firstChild);
    }
    return body;
  }

  function renderEvidenceMessage(text, loading) {
    resetEvidenceBody().appendChild(evidenceEl('p', loading ? 'evidence-muted evidence-loading' : 'evidence-muted', text));
  }

  function renderEvidenceError(message, retry) {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-error', message || 'Something went wrong reaching Climateshed.'));
    if (retry) {
      body.appendChild(evidenceButton('btn btn-secondary btn-small', 'Try again', retry));
    }
  }

  function renderEvidenceSignIn(note) {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-muted',
      'Sign in to search the Climateshed corpus for sources on this claim. You can assess without signing in.'));
    if (note) {
      body.appendChild(evidenceEl('p', 'evidence-warning', note));
    }

    var email = evidenceEl('input');
    email.type = 'text';
    email.placeholder = 'Your Climateshed email';
    email.setAttribute('autocomplete', 'email');
    email.value = evidenceState.pendingEmail;
    body.appendChild(email);

    var error = evidenceEl('p', 'evidence-error');
    var send = evidenceButton('btn btn-secondary btn-small', 'Email me a sign-in code', function() {
      var value = email.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
        error.textContent = 'Enter a valid email address.';
        return;
      }
      runEvidenceAction(send, 'Sending...', error, 'requestClimateshedCode', [value], function() {
        evidenceState.pendingEmail = value;
        renderEvidenceCodeEntry();
      });
    });
    body.appendChild(send);
    body.appendChild(error);
  }

  function renderEvidenceCodeEntry() {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-muted',
      'Enter the 6-digit code sent to ' + evidenceState.pendingEmail + '. It expires in 10 minutes.'));

    var code = evidenceEl('input');
    code.type = 'text';
    code.placeholder = '6-digit code';
    code.maxLength = 6;
    code.setAttribute('inputmode', 'numeric');
    code.setAttribute('autocomplete', 'one-time-code');
    body.appendChild(code);

    var error = evidenceEl('p', 'evidence-error');
    var signIn = evidenceButton('btn btn-primary btn-small', 'Sign in', function() {
      var value = code.value.trim();
      if (!/^\d{6}$/.test(value)) {
        error.textContent = 'Enter the 6-digit code from the email.';
        return;
      }
      runEvidenceAction(signIn, 'Signing in...', error, 'verifyClimateshedCode',
        [evidenceState.pendingEmail, value], onEvidenceAccount);
    });
    body.appendChild(signIn);
    body.appendChild(error);
    body.appendChild(evidenceButton('link-btn', 'Use a different email', function() { renderEvidenceSignIn(''); }));
    code.focus();
  }

  /**
   * Shown when Google hasn't granted the permission to connect to outside
   * services. This is separate from signing in to Climateshed.
   */
  function renderEvidencePermission(result) {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-muted',
      (result.error || 'The plugin needs your permission to connect to Climateshed.')
      + ' Google asks for this separately from signing in to Climateshed.'));
    if (result.authorizationUrl && /^https:\/\//i.test(result.authorizationUrl)) {
      body.appendChild(evidenceLink('Allow the connection', result.authorizationUrl));
    }
    body.appendChild(evidenceEl('p', 'evidence-muted evidence-small',
      'After allowing it, come back and click Try again. On Google\'s permission screen, tick every permission.'));
    body.appendChild(evidenceButton('btn btn-secondary btn-small', 'Try again', function() {
      evidenceState.account = null;
      startEvidencePanel(evidenceState.claim);
    }));
  }

  function renderEvidenceNoAccess(access) {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-muted', access.message));
    if (access.accountUrl) {
      body.appendChild(evidenceLink('Open your Climateshed account', access.accountUrl));
    }
  }

  function renderEvidenceResults(result) {
    var body = resetEvidenceBody();
    var results = result.results || [];
    var data = isEvidenceData(result.data) ? result.data : null;
    var relations = evidenceRelations(result);
    var visible = visibleEvidenceResults(results, relations);

    body.appendChild(buildSearchedFor(result));
    if (data) {
      body.appendChild(buildEvidenceData(data));
    }

    if (results.length === 0) {
      body.appendChild(evidenceEl('p', 'evidence-muted',
        (data ? 'No passages in the Climateshed corpus cover this. ' : 'The Climateshed corpus doesn\'t cover this. ')
        + 'That isn\'t the same as limited evidence. Try editing the search, or add any sources you know of below.'));
      return;
    }

    if (visible.length === 0) {
      body.appendChild(evidenceEl('p', 'evidence-muted',
        'None of the ' + results.length + ' passages address the claim directly, so they\'re hidden. '
        + 'That isn\'t the same as limited evidence. Try editing the search, or add any sources you know of below.'));
      return;
    }

    var documentCount = countEvidenceDocuments(visible.map(function(entry) { return entry.item; }));
    body.appendChild(evidenceEl('p', 'evidence-muted',
      visible.length + ' passage' + (visible.length === 1 ? '' : 's') + ' from '
      + documentCount + ' document' + (documentCount === 1 ? '' : 's')
      + (result.claimPlace ? ', local sources first' : ', most relevant first')
      + ' (up to 2 passages per document). Nothing is added to your assessment unless you choose it.'));

    if (relations) {
      var hidden = results.length - visible.length;
      body.appendChild(evidenceEl('p', 'evidence-muted evidence-small',
        'Labels are from Climateshed\'s AI, reading only each passage\'s text. Check the passage before relying on one.'
        + (hidden === 1 ? ' 1 passage that doesn\'t address the claim is hidden.' : '')
        + (hidden > 1 ? ' ' + hidden + ' passages that don\'t address the claim are hidden.' : '')));
    }

    visible.forEach(function(entry) {
      body.appendChild(buildEvidenceResult(entry.item, result.claimPlace, entry.relation));
    });

    if (!relations) {
      body.appendChild(buildEvidenceRelate(result));
    }

    body.appendChild(evidenceEl('p', 'evidence-muted evidence-small',
      'Passages are quoted from the Climateshed corpus. Check the original document before citing it.'));
  }

  /**
   * The labels for a search result, or null if it hasn't been labeled (or the
   * labels don't line up with its passages).
   */
  function evidenceRelations(result) {
    var relations = result.relations;
    return Array.isArray(relations) && relations.length === (result.results || []).length ? relations : null;
  }

  /**
   * The passages to show, each with its label. Passages labeled as not
   * addressing the claim are left out.
   * @param {Object[]} results
   * @param {Object[]|null} relations - One { relation, quote } per result, or null before labeling.
   * @returns {Object[]} [{ item, relation }], where relation is null before labeling.
   */
  function visibleEvidenceResults(results, relations) {
    var visible = [];
    results.forEach(function(item, index) {
      var relation = relations ? relations[index] : null;
      if (!relation || relation.relation !== 'does_not_address') {
        visible.push({ item: item, relation: relation });
      }
    });
    return visible;
  }

  /** Counts distinct documents, matching the server: the same title and link. */
  function countEvidenceDocuments(items) {
    var seen = {};
    items.forEach(function(item) {
      seen[JSON.stringify([item.title, item.url || null])] = true;
    });
    return Object.keys(seen).length;
  }

  /**
   * Button that asks Climateshed how each passage bears on the claim. Labels
   * are requested only when the author clicks, because each request is a
   * separate AI reading of every passage.
   */
  function buildEvidenceRelate(result) {
    var box = evidenceEl('div', 'evidence-relate');
    var error = evidenceEl('p', 'evidence-error');
    var button = evidenceButton('btn btn-secondary btn-small', 'How do these sources relate?', function() {
      var claim = evidenceState.claim;
      if (!claim) {
        return;
      }
      var isCurrent = function() {
        return claim === evidenceState.claim && result === evidenceState.lastResult;
      };
      var fail = function(message) {
        error.textContent = message || 'Something went wrong reaching Climateshed.';
        button.disabled = false;
        button.textContent = 'Try again';
      };

      error.textContent = '';
      button.disabled = true;
      button.textContent = 'Reading the passages...';

      google.script.run
        .withSuccessHandler(function(response) {
          if (!isCurrent()) {
            return; // The claim or the search changed while the passages were read.
          }
          if (response && response.success) {
            result.relations = response.relations;
            // If the author moved on (for example, to edit the search), the labels show when they come back.
            if (document.body.contains(box)) {
              renderEvidenceResults(result);
            }
          } else if (response && (response.permissionRequired || response.signedOut || response.accessDenied)) {
            renderEvidenceFailure(response, null);
          } else {
            fail(response && response.error);
          }
        })
        .withFailureHandler(function(err) {
          if (isCurrent()) {
            fail(err.message);
          }
        })
        .relateClimateshedEvidence({
          claimText: claim.text,
          searchQuery: result.searchQuery || null,
          passages: (result.results || []).map(function(item) { return item.passage || ''; })
        });
    });

    box.appendChild(button);
    box.appendChild(evidenceEl('p', 'evidence-muted evidence-small',
      'Climateshed\'s AI reads each passage and labels whether it supports, qualifies, or contradicts your claim, '
      + 'quoting the words it relied on. Passages that don\'t address the claim are hidden. This can take up to a minute.'));
    box.appendChild(error);
    return box;
  }

  /**
   * Shows the text that was actually searched, so the author can see how the
   * claim was read, with a way to edit it and search again.
   */
  function buildSearchedFor(result) {
    var box = evidenceEl('div', 'evidence-query');
    box.appendChild(evidenceEl('div', 'evidence-query-label',
      EVIDENCE_QUERY_LABELS[result.querySource] || 'Searched for:'));
    box.appendChild(evidenceEl('div', 'evidence-query-text', result.searchQuery || ''));
    if (result.claimPlace) {
      box.appendChild(evidenceEl('div', 'evidence-query-place', 'Place: ' + result.claimPlace));
    }
    box.appendChild(evidenceButton('link-btn', 'Edit search', function() {
      renderEvidenceQueryEditor(result.searchQuery || (evidenceState.claim ? evidenceState.claim.text : ''));
    }));
    return box;
  }

  function renderEvidenceQueryEditor(text) {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-muted',
      'Edit what to search for. This changes only the search, not your document or your claim.'));

    var input = evidenceEl('textarea');
    input.rows = 3;
    input.value = text;
    body.appendChild(input);

    var error = evidenceEl('p', 'evidence-error');
    body.appendChild(evidenceButton('btn btn-primary btn-small', 'Search again', function() {
      var value = input.value.replace(/\s+/g, ' ').trim();
      if (value.length < 10 || value.length > 2000) {
        error.textContent = 'Search text must be between 10 and 2,000 characters.';
        return;
      }
      runEvidenceSearch(value);
    }));
    body.appendChild(error);
    body.appendChild(evidenceButton('link-btn', 'Cancel', function() {
      if (evidenceState.lastResult) {
        renderEvidenceResults(evidenceState.lastResult);
      } else {
        runEvidenceSearch(null);
      }
    }));
    input.focus();
  }

  /**
   * True if a search result's climate data has something to show. The server
   * sends data only for a city or county claim that refers to a climate measure.
   */
  function isEvidenceData(data) {
    return !!data && Array.isArray(data.measures) && data.measures.length > 0
      && Array.isArray(data.decades) && data.decades.length > 0
      && Array.isArray(data.scenarios) && data.scenarios.length > 0;
  }

  function isEvidenceNumber(value) {
    return typeof value === 'number' && isFinite(value);
  }

  // Temperatures keep one decimal; day counts, degree days, and precipitation are whole numbers.
  function evidenceDataDecimals(units) {
    return units === '°F' ? 1 : 0;
  }

  function formatEvidenceDataValue(value, units) {
    return isEvidenceNumber(value) ? value.toFixed(evidenceDataDecimals(units)) : '–';
  }

  /**
   * Change from the baseline, worked out from the rounded values so it matches
   * the numbers shown. Empty when either value is missing.
   */
  function formatEvidenceDataChange(value, baseline, units) {
    if (!isEvidenceNumber(value) || !isEvidenceNumber(baseline)) {
      return '';
    }
    var decimals = evidenceDataDecimals(units);
    var change = Number(value.toFixed(decimals)) - Number(baseline.toFixed(decimals));
    var size = Math.abs(change).toFixed(decimals);
    if (Number(size) === 0) {
      return '0';
    }
    return (change > 0 ? '+' : '-') + size;
  }

  /**
   * Climate projections for the claim's city or county, from Climateshed data.
   * Climateshed chose the measures and starting decade from the claim's wording;
   * the numbers are shown as stored, rounded, with the change from the baseline.
   * The card is never labeled: whether the numbers match the claim is the author's call.
   */
  function buildEvidenceData(data) {
    var card = evidenceEl('div', 'evidence-result evidence-data');
    var decade = data.decades.indexOf(data.decade) === -1 ? data.decades[0] : data.decade;
    var period = String(data.baseline_period || '1981-2010').replace('-', '–');
    var models = isEvidenceNumber(data.models) ? data.models : null;

    card.appendChild(evidenceEl('div', 'evidence-result-title', 'Climate projections for ' + data.place));
    card.appendChild(evidenceEl('div', 'evidence-result-meta',
      'LOCA2 downscaled CMIP6' + (models ? ' · ' + models + '-model ensemble' : '') + ' · Climateshed data'));

    var picker = evidenceEl('div', 'evidence-data-decade');
    picker.appendChild(evidenceEl('span', '', 'Decade'));
    var select = evidenceEl('select');
    data.decades.forEach(function(option) {
      var item = evidenceEl('option', '', option);
      item.value = option;
      select.appendChild(item);
    });
    select.value = decade;
    picker.appendChild(select);
    card.appendChild(picker);

    if (!data.decade_from_claim) {
      card.appendChild(evidenceEl('p', 'evidence-muted evidence-small',
        'The claim doesn\'t name a decade the data covers, so this starts at the ' + decade + '.'));
    }

    var measures = evidenceEl('div');
    card.appendChild(measures);

    card.appendChild(evidenceEl('p', 'evidence-muted evidence-small',
      'Scenarios: SSP2-4.5 is intermediate emissions, SSP3-7.0 high, and SSP5-8.5 very high. '
      + 'Each value is a decade average: the median of the ' + (models ? models + ' ' : '')
      + 'models, with the range from the 10th to 90th percentile. '
      + 'The range shows only how the models differ, not the full uncertainty. '
      + 'Change is from ' + period + '. Values are rounded.'));
    if (data.nearest_cell) {
      card.appendChild(evidenceEl('p', 'evidence-muted evidence-small',
        'This place is smaller than the data grid, so its values come from the nearest grid cell.'));
    }

    var actions = evidenceEl('div', 'evidence-actions');
    var source = data.source || {};
    if (source.url && /^https?:\/\//i.test(source.url)) {
      actions.appendChild(evidenceLink('About the data', source.url));
    }
    var add = evidenceButton('btn btn-secondary evidence-add-btn', 'Add as source', function() {
      addEvidenceAsSource(evidenceDataSource(data, decade), add);
    });
    actions.appendChild(add);
    card.appendChild(actions);

    function showDecade() {
      while (measures.firstChild) {
        measures.removeChild(measures.firstChild);
      }
      data.measures.forEach(function(measure) {
        measures.appendChild(buildEvidenceDataMeasure(measure, decade, data.scenarios, period));
      });
    }

    select.addEventListener('change', function() {
      decade = select.value;
      showDecade();
      // The source title names the decade, so another decade can be added as its own source.
      add.disabled = false;
      add.textContent = 'Add as source';
    });
    showDecade();

    return card;
  }

  function buildEvidenceDataMeasure(measure, decade, scenarios, period) {
    var block = evidenceEl('div', 'evidence-data-measure');
    block.appendChild(evidenceEl('div', 'evidence-data-label',
      measure.label + (measure.units ? ' (' + measure.units + ')' : '')));

    var table = evidenceEl('table', 'evidence-data-table');
    var head = evidenceEl('tr');
    ['', 'Median', 'Model range', 'Change'].forEach(function(text) {
      head.appendChild(evidenceEl('th', '', text));
    });
    table.appendChild(head);

    var baseline = measure.baseline && isEvidenceNumber(measure.baseline.median) ? measure.baseline : null;
    if (baseline) {
      table.appendChild(buildEvidenceDataRow(period, baseline, null, measure.units));
    }
    var byScenario = (measure.projections && measure.projections[decade]) || {};
    scenarios.forEach(function(scenario) {
      table.appendChild(buildEvidenceDataRow(EVIDENCE_SCENARIO_LABELS[scenario] || scenario,
        byScenario[scenario], baseline, measure.units));
    });
    block.appendChild(table);

    if (!baseline) {
      block.appendChild(evidenceEl('div', 'evidence-muted evidence-small',
        'No ' + period + ' value: this measure is defined relative to that period.'));
    }
    return block;
  }

  function buildEvidenceDataRow(label, stats, baseline, units) {
    var row = evidenceEl('tr');
    row.appendChild(evidenceEl('th', '', label));
    if (!stats || !isEvidenceNumber(stats.median)) {
      var missing = evidenceEl('td', 'evidence-muted', 'No data');
      missing.colSpan = 3;
      row.appendChild(missing);
      return row;
    }
    var range = isEvidenceNumber(stats.p10) && isEvidenceNumber(stats.p90)
      ? formatEvidenceDataValue(stats.p10, units) + '–' + formatEvidenceDataValue(stats.p90, units)
      : '';
    row.appendChild(evidenceEl('td', '', formatEvidenceDataValue(stats.median, units)));
    row.appendChild(evidenceEl('td', 'evidence-data-range', range));
    row.appendChild(evidenceEl('td', '', baseline ? formatEvidenceDataChange(stats.median, baseline.median, units) : ''));
    return row;
  }

  /** Source fields for a data card: the dataset, place, decade, and measures shown. */
  function evidenceDataSource(data, decade) {
    var source = data.source || {};
    return {
      title: (source.title || 'Climate projections') + ' for ' + data.place + ', ' + decade + ': '
        + data.measures.map(function(measure) { return measure.label; }).join('; '),
      publisher: source.publisher || '',
      year: null,
      url: source.url || ''
    };
  }

  // PDF text extraction leaves hard line breaks and private-use symbol glyphs
  // (bullets that don't display). Tidy both for reading; the words are unchanged.
  var EVIDENCE_SYMBOL_GLYPHS = new RegExp('[' + String.fromCharCode(0xE000) + '-' + String.fromCharCode(0xF8FF) + ']', 'g');

  function formatPassage(text) {
    return String(text)
      .replace(/\r\n?/g, '\n')
      .replace(EVIDENCE_SYMBOL_GLYPHS, '•')
      .split(/\n[ \t]*\n/)
      .map(function(paragraph) {
        return paragraph.split('\n').reduce(function(joined, line) {
          var trimmed = line.replace(/\s+/g, ' ').trim();
          if (!trimmed) return joined;
          if (!joined) return trimmed;
          // Keep bullets on their own line; join lines the PDF wrapped.
          return joined + (/^[•\-]/.test(trimmed) ? '\n' : ' ') + trimmed;
        }, '');
      })
      .filter(function(paragraph) { return paragraph; })
      .join('\n\n');
  }

  /**
   * A passage's label and the quote it rests on, or a note that the passage
   * has no confirmed label.
   */
  function buildEvidenceRelation(relation) {
    var label = EVIDENCE_RELATION_LABELS[relation.relation];
    if (!label || !relation.quote) {
      return evidenceEl('div', 'evidence-muted evidence-small evidence-relation-none',
        'No label: Climateshed couldn\'t confirm a quote from this passage to base one on.');
    }
    var box = evidenceEl('div', 'evidence-relation-box');
    box.appendChild(evidenceEl('span', 'evidence-relation evidence-relation-' + relation.relation, label));
    box.appendChild(evidenceEl('div', 'evidence-relation-quote', '“' + relation.quote + '”'));
    return box;
  }

  /**
   * @param {Object} item - A search result.
   * @param {string|null} claimPlace - The place the claim is about.
   * @param {Object|null} relation - The passage's { relation, quote }, or null before labeling.
   */
  function buildEvidenceResult(item, claimPlace, relation) {
    var card = evidenceEl('div', 'evidence-result');
    card.appendChild(evidenceEl('div', 'evidence-result-title', item.title));

    var showPlace = item.place && String(item.title).indexOf(item.place) === -1;
    var meta = [showPlace ? item.place : '', item.year, EVIDENCE_DOC_TYPE_LABELS[item.doc_type] || item.doc_type]
      .filter(function(part) { return part; })
      .join(' · ');
    if (meta) {
      card.appendChild(evidenceEl('div', 'evidence-result-meta', meta));
    }
    if (item.place_match === 'other') {
      card.appendChild(evidenceEl('div', 'evidence-place evidence-place-other', 'Different place from your claim'));
    } else if (item.place_match === 'same') {
      card.appendChild(evidenceEl('div', 'evidence-place evidence-place-same', 'Same place as your claim'));
    } else if (item.place_match === 'related') {
      // Same name at a different level, e.g. a city plan for a claim about the county.
      card.appendChild(evidenceEl('div', 'evidence-place evidence-place-related',
        claimPlace ? 'Related place: your claim is about ' + claimPlace : 'Related place'));
    }
    if (relation) {
      card.appendChild(buildEvidenceRelation(relation));
    }

    var passage = formatPassage(item.passage || '');
    var excerpt = passage.length > EVIDENCE_EXCERPT_CHARS ? passage.substring(0, EVIDENCE_EXCERPT_CHARS) + '...' : passage;
    var passageEl = evidenceEl('div', 'evidence-passage', excerpt);
    card.appendChild(passageEl);

    var actions = evidenceEl('div', 'evidence-actions');
    if (excerpt !== passage) {
      var toggle = evidenceButton('link-btn', 'Show full passage', function() {
        var showingFull = passageEl.textContent === passage;
        passageEl.textContent = showingFull ? excerpt : passage;
        toggle.textContent = showingFull ? 'Show full passage' : 'Hide full passage';
      });
      actions.appendChild(toggle);
    }
    if (item.url && /^https?:\/\//i.test(item.url)) {
      actions.appendChild(evidenceLink('Open document', item.url));
    }
    var add = evidenceButton('btn btn-secondary evidence-add-btn', 'Add as source', function() {
      addEvidenceAsSource(item, add);
    });
    actions.appendChild(add);
    card.appendChild(actions);

    return card;
  }

  /**
   * Adds a search result or climate data card to the Sources list, replacing an
   * empty source card if there is one. Publisher is filled in only when
   * Climateshed knows it (climate data); page is left for the author.
   */
  function addEvidenceAsSource(item, button) {
    var cards = document.querySelectorAll('#sourceList .source-card');
    for (var i = 0; i < cards.length; i++) {
      var inputs = cards[i].querySelectorAll('input');
      var isBlank = Array.prototype.every.call(inputs, function(input) { return !input.value.trim(); });
      if (isBlank) {
        cards[i].parentNode.removeChild(cards[i]);
        break;
      }
    }

    if (document.querySelectorAll('#sourceList .source-card').length >= MAX_SOURCES) {
      updateSourceCards();
      button.textContent = 'Source limit reached';
      button.disabled = true;
      return;
    }

    addSourceCard({
      title: item.title,
      publisher: item.publisher || '',
      year: item.year ? String(item.year) : '',
      page: '',
      url: item.url && /^https?:\/\//i.test(item.url) ? item.url : '',
      origin: 'climateshed'
    });
    button.textContent = 'Added below';
    button.disabled = true;
  }

  function updateEvidenceFooter() {
    var account = evidenceState.account;
    var footer = document.getElementById('evidenceFooter');
    if (account && account.signedIn) {
      document.getElementById('evidenceSignedInAs').textContent = 'Signed in as ' + (account.email || 'Climateshed user');
      footer.style.display = 'flex';
    } else {
      footer.style.display = 'none';
    }
  }

  function signOutOfEvidence() {
    google.script.run
      .withSuccessHandler(function() {
        evidenceState.searchedClaim = null;
        evidenceState.lastResult = null;
        onEvidenceAccount({ success: true, signedIn: false });
      })
      .withFailureHandler(function(err) { renderEvidenceError(err.message, null); })
      .signOutOfClimateshed();
  }
</script>
