<!--
  Evidence from Climateshed. Included into Sidebar.html.
  Suggestions only: nothing reaches the assessment unless the author clicks
  "Add as source". All text from the server is inserted with textContent.
-->
<div class="section evidence-panel" id="evidencePanel">
  <label>Evidence from Climateshed</label>
  <div id="evidenceBody" class="evidence-body"></div>
  <div id="evidenceFooter" class="evidence-footer" style="display:none;">
    <span id="evidenceSignedInAs"></span>
    <button type="button" class="link-btn" id="evidenceSignOutBtn">Sign out</button>
  </div>
</div>

<script>
  var evidenceState = {
    claim: null,          // { text, pendingRangeName?, assessmentId? } for the claim in the sidebar
    account: null,        // last successful result of getClimateshedAccount()
    pendingEmail: '',     // email a sign-in code was sent to
    searchedClaim: null,  // text of the claim whose results are displayed
    lastResult: null      // last successful search result, to return to after editing the search
  };

  var EVIDENCE_DOC_TYPE_LABELS = {
    scientific: 'Scientific',
    report: 'Report',
    assessment: 'Assessment',
    regulation: 'Regulation',
    plan: 'Plan',
    strategy: 'Strategy',
    guidance: 'Guidance',
    data: 'Data'
  };

  var EVIDENCE_QUERY_LABELS = {
    rewritten: 'Searched for (reworded using the heading and nearby text):',
    author: 'Searched for (your edited search):',
    claim: 'Searched for your claim as written:'
  };

  var EVIDENCE_EXCERPT_CHARS = 280;

  /**
   * Starts or refreshes the panel for a claim. The sidebar calls this when a
   * claim is shown: on open, after Capture Selection, and in edit mode.
   * @param {Object|null} claim - { text, pendingRangeName?, assessmentId? }
   */
  function startEvidencePanel(claim) {
    evidenceState.claim = claim && claim.text ? claim : null;
    document.getElementById('evidenceSignOutBtn').onclick = signOutOfEvidence;

    if (evidenceState.account) {
      onEvidenceAccount(evidenceState.account);
      return;
    }

    renderEvidenceMessage('Checking your Climateshed account...', true);
    google.script.run
      .withSuccessHandler(onEvidenceAccount)
      .withFailureHandler(function(err) {
        renderEvidenceError(err.message, function() { startEvidencePanel(evidenceState.claim); });
      })
      .getClimateshedAccount();
  }

  /**
   * Shows the right panel state for the account, and searches when allowed.
   * @param {Object} result - From getClimateshedAccount() or verifyClimateshedCode().
   */
  function onEvidenceAccount(result) {
    if (result && result.permissionRequired) {
      renderEvidencePermission(result);
      return;
    }
    if (!result || !result.success) {
      renderEvidenceError(result && result.error, function() { startEvidencePanel(evidenceState.claim); });
      return;
    }

    evidenceState.account = result;
    updateEvidenceFooter();

    if (!result.signedIn) {
      renderEvidenceSignIn(result.expired ? 'Your Climateshed session expired. Sign in again to search.' : '');
    } else if (!result.access.allowed) {
      renderEvidenceNoAccess(result.access);
    } else if (!evidenceState.claim) {
      renderEvidenceMessage('Select a claim to search Climateshed for sources.');
    } else if (evidenceState.searchedClaim !== evidenceState.claim.text) {
      runEvidenceSearch(null);
    }
  }

  /**
   * Searches for the current claim. Climateshed rewords the claim using its
   * heading and nearby text, unless the author edited the search text.
   * @param {string|null} query - Search text the author edited, searched as written.
   */
  function runEvidenceSearch(query) {
    var claim = evidenceState.claim;
    if (!claim) {
      return;
    }
    var retry = function() { runEvidenceSearch(query); };
    renderEvidenceMessage(query
      ? 'Searching Climateshed for your edited search...'
      : 'Searching Climateshed... The first search after a quiet period can take up to 30 seconds.', true);

    google.script.run
      .withSuccessHandler(function(result) {
        if (claim !== evidenceState.claim) {
          return; // A different claim was captured while this search ran.
        }
        if (result && result.success) {
          evidenceState.searchedClaim = claim.text;
          evidenceState.lastResult = result;
          renderEvidenceResults(result);
        } else if (result && result.permissionRequired) {
          renderEvidencePermission(result);
        } else if (result && result.signedOut) {
          onEvidenceAccount({ success: true, signedIn: false, expired: true });
        } else if (result && result.accessDenied) {
          var access = { allowed: false, message: result.error, accountUrl: result.accountUrl };
          if (evidenceState.account) {
            evidenceState.account.access = access;
          }
          renderEvidenceNoAccess(access);
        } else {
          renderEvidenceError(result && result.error, retry);
        }
      })
      .withFailureHandler(function(err) {
        if (claim === evidenceState.claim) {
          renderEvidenceError(err.message, retry);
        }
      })
      .searchClimateshedEvidence({
        claimText: claim.text,
        pendingRangeName: claim.pendingRangeName || null,
        assessmentId: claim.assessmentId || null,
        query: query || null,
        // An edited search keeps the place found for the claim, for result ordering.
        place: query && evidenceState.lastResult ? evidenceState.lastResult.claimPlace || null : null
      });
  }

  /**
   * Runs a Climateshed.gs function from a button, with a busy label and inline errors.
   * @param {HTMLButtonElement} button
   * @param {string} busyLabel
   * @param {HTMLElement} errorEl
   * @param {string} functionName - Server function in Climateshed.gs.
   * @param {Array} args
   * @param {Function} onSuccess - Receives the { success: true, ... } result.
   */
  function runEvidenceAction(button, busyLabel, errorEl, functionName, args, onSuccess) {
    var idleLabel = button.textContent;
    var fail = function(message) {
      errorEl.textContent = message || 'Something went wrong reaching Climateshed.';
      button.disabled = false;
      button.textContent = idleLabel;
    };

    errorEl.textContent = '';
    button.disabled = true;
    button.textContent = busyLabel;

    var runner = google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          onSuccess(result);
        } else if (result && result.permissionRequired) {
          renderEvidencePermission(result);
        } else {
          fail(result && result.error);
        }
      })
      .withFailureHandler(function(err) { fail(err.message); });
    runner[functionName].apply(runner, args);
  }

  function evidenceEl(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function evidenceButton(className, label, onClick) {
    var button = evidenceEl('button', className, label);
    button.type = 'button';
    button.addEventListener('click', function() { onClick(); });
    return button;
  }

  function evidenceLink(label, url) {
    var link = evidenceEl('a', '', label);
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    return link;
  }

  function resetEvidenceBody() {
    var body = document.getElementById('evidenceBody');
    while (body.firstChild) {
      body.removeChild(body.firstChild);
    }
    return body;
  }

  function renderEvidenceMessage(text, loading) {
    resetEvidenceBody().appendChild(evidenceEl('p', loading ? 'evidence-muted evidence-loading' : 'evidence-muted', text));
  }

  function renderEvidenceError(message, retry) {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-error', message || 'Something went wrong reaching Climateshed.'));
    if (retry) {
      body.appendChild(evidenceButton('btn btn-secondary btn-small', 'Try again', retry));
    }
  }

  function renderEvidenceSignIn(note) {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-muted',
      'Sign in to search the Climateshed corpus for sources on this claim. You can assess without signing in.'));
    if (note) {
      body.appendChild(evidenceEl('p', 'evidence-warning', note));
    }

    var email = evidenceEl('input');
    email.type = 'text';
    email.placeholder = 'Your Climateshed email';
    email.setAttribute('autocomplete', 'email');
    email.value = evidenceState.pendingEmail;
    body.appendChild(email);

    var error = evidenceEl('p', 'evidence-error');
    var send = evidenceButton('btn btn-secondary btn-small', 'Email me a sign-in code', function() {
      var value = email.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
        error.textContent = 'Enter a valid email address.';
        return;
      }
      runEvidenceAction(send, 'Sending...', error, 'requestClimateshedCode', [value], function() {
        evidenceState.pendingEmail = value;
        renderEvidenceCodeEntry();
      });
    });
    body.appendChild(send);
    body.appendChild(error);
  }

  function renderEvidenceCodeEntry() {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-muted',
      'Enter the 6-digit code sent to ' + evidenceState.pendingEmail + '. It expires in 10 minutes.'));

    var code = evidenceEl('input');
    code.type = 'text';
    code.placeholder = '6-digit code';
    code.maxLength = 6;
    code.setAttribute('inputmode', 'numeric');
    code.setAttribute('autocomplete', 'one-time-code');
    body.appendChild(code);

    var error = evidenceEl('p', 'evidence-error');
    var signIn = evidenceButton('btn btn-primary btn-small', 'Sign in', function() {
      var value = code.value.trim();
      if (!/^\d{6}$/.test(value)) {
        error.textContent = 'Enter the 6-digit code from the email.';
        return;
      }
      runEvidenceAction(signIn, 'Signing in...', error, 'verifyClimateshedCode',
        [evidenceState.pendingEmail, value], onEvidenceAccount);
    });
    body.appendChild(signIn);
    body.appendChild(error);
    body.appendChild(evidenceButton('link-btn', 'Use a different email', function() { renderEvidenceSignIn(''); }));
    code.focus();
  }

  /**
   * Shown when Google hasn't granted the permission to connect to outside
   * services. This is separate from signing in to Climateshed.
   */
  function renderEvidencePermission(result) {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-muted',
      (result.error || 'The plugin needs your permission to connect to Climateshed.')
      + ' Google asks for this separately from signing in to Climateshed.'));
    if (result.authorizationUrl && /^https:\/\//i.test(result.authorizationUrl)) {
      body.appendChild(evidenceLink('Allow the connection', result.authorizationUrl));
    }
    body.appendChild(evidenceEl('p', 'evidence-muted evidence-small',
      'After allowing it, come back and click Try again. On Google\'s permission screen, tick every permission.'));
    body.appendChild(evidenceButton('btn btn-secondary btn-small', 'Try again', function() {
      evidenceState.account = null;
      startEvidencePanel(evidenceState.claim);
    }));
  }

  function renderEvidenceNoAccess(access) {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-muted', access.message));
    if (access.accountUrl) {
      body.appendChild(evidenceLink('Open your Climateshed account', access.accountUrl));
    }
  }

  function renderEvidenceResults(result) {
    var body = resetEvidenceBody();
    var results = result.results || [];

    body.appendChild(buildSearchedFor(result));

    if (results.length === 0) {
      body.appendChild(evidenceEl('p', 'evidence-muted',
        'The Climateshed corpus doesn\'t cover this. That isn\'t the same as limited evidence. '
        + 'Try editing the search, or add any sources you know of below.'));
      return;
    }

    body.appendChild(evidenceEl('p', 'evidence-muted',
      results.length + ' passage' + (results.length === 1 ? '' : 's') + ' from '
      + result.documentCount + ' document' + (result.documentCount === 1 ? '' : 's')
      + ', most relevant first. Nothing is added to your assessment unless you choose it.'));

    results.forEach(function(item) {
      body.appendChild(buildEvidenceResult(item));
    });

    body.appendChild(evidenceEl('p', 'evidence-muted evidence-small',
      'Passages are quoted from the Climateshed corpus. Check the original document before citing it.'));
  }

  /**
   * Shows the text that was actually searched, so the author can see how the
   * claim was read, with a way to edit it and search again.
   */
  function buildSearchedFor(result) {
    var box = evidenceEl('div', 'evidence-query');
    box.appendChild(evidenceEl('div', 'evidence-query-label',
      EVIDENCE_QUERY_LABELS[result.querySource] || 'Searched for:'));
    box.appendChild(evidenceEl('div', 'evidence-query-text', result.searchQuery || ''));
    if (result.claimPlace) {
      box.appendChild(evidenceEl('div', 'evidence-query-place', 'Place: ' + result.claimPlace));
    }
    box.appendChild(evidenceButton('link-btn', 'Edit search', function() {
      renderEvidenceQueryEditor(result.searchQuery || (evidenceState.claim ? evidenceState.claim.text : ''));
    }));
    return box;
  }

  function renderEvidenceQueryEditor(text) {
    var body = resetEvidenceBody();
    body.appendChild(evidenceEl('p', 'evidence-muted',
      'Edit what to search for. This changes only the search, not your document or your claim.'));

    var input = evidenceEl('textarea');
    input.rows = 3;
    input.value = text;
    body.appendChild(input);

    var error = evidenceEl('p', 'evidence-error');
    body.appendChild(evidenceButton('btn btn-primary btn-small', 'Search again', function() {
      var value = input.value.replace(/\s+/g, ' ').trim();
      if (value.length < 10 || value.length > 2000) {
        error.textContent = 'Search text must be between 10 and 2,000 characters.';
        return;
      }
      runEvidenceSearch(value);
    }));
    body.appendChild(error);
    body.appendChild(evidenceButton('link-btn', 'Cancel', function() {
      if (evidenceState.lastResult) {
        renderEvidenceResults(evidenceState.lastResult);
      } else {
        runEvidenceSearch(null);
      }
    }));
    input.focus();
  }

  // PDF text extraction leaves hard line breaks and private-use symbol glyphs
  // (bullets that don't display). Tidy both for reading; the words are unchanged.
  var EVIDENCE_SYMBOL_GLYPHS = new RegExp('[' + String.fromCharCode(0xE000) + '-' + String.fromCharCode(0xF8FF) + ']', 'g');

  function formatPassage(text) {
    return String(text)
      .replace(/\r\n?/g, '\n')
      .replace(EVIDENCE_SYMBOL_GLYPHS, '•')
      .split(/\n[ \t]*\n/)
      .map(function(paragraph) {
        return paragraph.split('\n').reduce(function(joined, line) {
          var trimmed = line.replace(/\s+/g, ' ').trim();
          if (!trimmed) return joined;
          if (!joined) return trimmed;
          // Keep bullets on their own line; join lines the PDF wrapped.
          return joined + (/^[•\-]/.test(trimmed) ? '\n' : ' ') + trimmed;
        }, '');
      })
      .filter(function(paragraph) { return paragraph; })
      .join('\n\n');
  }

  function buildEvidenceResult(item) {
    var card = evidenceEl('div', 'evidence-result');
    card.appendChild(evidenceEl('div', 'evidence-result-title', item.title));

    var showPlace = item.place && String(item.title).indexOf(item.place) === -1;
    var meta = [showPlace ? item.place : '', item.year, EVIDENCE_DOC_TYPE_LABELS[item.doc_type] || item.doc_type]
      .filter(function(part) { return part; })
      .join(' · ');
    if (meta) {
      card.appendChild(evidenceEl('div', 'evidence-result-meta', meta));
    }
    if (item.place_match === 'other') {
      card.appendChild(evidenceEl('div', 'evidence-place evidence-place-other', 'Different place from your claim'));
    } else if (item.place_match === 'same') {
      card.appendChild(evidenceEl('div', 'evidence-place evidence-place-same', 'Same place as your claim'));
    }

    var passage = formatPassage(item.passage || '');
    var excerpt = passage.length > EVIDENCE_EXCERPT_CHARS ? passage.substring(0, EVIDENCE_EXCERPT_CHARS) + '...' : passage;
    var passageEl = evidenceEl('div', 'evidence-passage', excerpt);
    card.appendChild(passageEl);

    var actions = evidenceEl('div', 'evidence-actions');
    if (excerpt !== passage) {
      var toggle = evidenceButton('link-btn', 'Show full passage', function() {
        var showingFull = passageEl.textContent === passage;
        passageEl.textContent = showingFull ? excerpt : passage;
        toggle.textContent = showingFull ? 'Show full passage' : 'Hide full passage';
      });
      actions.appendChild(toggle);
    }
    if (item.url && /^https?:\/\//i.test(item.url)) {
      actions.appendChild(evidenceLink('Open document', item.url));
    }
    var add = evidenceButton('btn btn-secondary evidence-add-btn', 'Add as source', function() {
      addEvidenceAsSource(item, add);
    });
    actions.appendChild(add);
    card.appendChild(actions);

    return card;
  }

  /**
   * Adds a search result to the Sources list, replacing an empty source card if
   * there is one. Publisher and page are left for the author to fill in.
   */
  function addEvidenceAsSource(item, button) {
    var cards = document.querySelectorAll('#sourceList .source-card');
    for (var i = 0; i < cards.length; i++) {
      var inputs = cards[i].querySelectorAll('input');
      var isBlank = Array.prototype.every.call(inputs, function(input) { return !input.value.trim(); });
      if (isBlank) {
        cards[i].parentNode.removeChild(cards[i]);
        break;
      }
    }

    if (document.querySelectorAll('#sourceList .source-card').length >= MAX_SOURCES) {
      updateSourceCards();
      button.textContent = 'Source limit reached';
      button.disabled = true;
      return;
    }

    addSourceCard({
      title: item.title,
      publisher: '',
      year: item.year ? String(item.year) : '',
      page: '',
      url: item.url && /^https?:\/\//i.test(item.url) ? item.url : '',
      origin: 'climateshed'
    });
    button.textContent = 'Added below';
    button.disabled = true;
  }

  function updateEvidenceFooter() {
    var account = evidenceState.account;
    var footer = document.getElementById('evidenceFooter');
    if (account && account.signedIn) {
      document.getElementById('evidenceSignedInAs').textContent = 'Signed in as ' + (account.email || 'Climateshed user');
      footer.style.display = 'flex';
    } else {
      footer.style.display = 'none';
    }
  }

  function signOutOfEvidence() {
    google.script.run
      .withSuccessHandler(function() {
        evidenceState.searchedClaim = null;
        evidenceState.lastResult = null;
        onEvidenceAccount({ success: true, signedIn: false });
      })
      .withFailureHandler(function(err) { renderEvidenceError(err.message, null); })
      .signOutOfClimateshed();
  }
</script>
